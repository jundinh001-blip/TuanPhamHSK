<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuanPhamHSK - EdTech Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+SC:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a202c;
            overflow: hidden;
            touch-action: manipulation;
        }
        .hanzi-font { font-family: 'Noto Sans SC', sans-serif; }
        
        .stage-bg {
            background: linear-gradient(to bottom, #4a90e2, #87ceeb 60%, #e2e8f0 60%, #cbd5e1);
        }
        
        .character {
            font-size: 80px;
            transition: transform 0.1s ease-out, filter 0.2s;
            display: inline-block;
        }

        /* Idle Animations */
        @keyframes idle-player { 0%, 100% { transform: translateY(0) scaleX(1); } 50% { transform: translateY(-10px) scaleX(1.05); } }
        @keyframes idle-enemy { 0%, 100% { transform: translateY(0) scaleX(-1); } 50% { transform: translateY(-10px) scaleX(-1.05); } }
        
        .idle-p { animation: idle-player 2s infinite ease-in-out; }
        .idle-e { animation: idle-enemy 2.2s infinite ease-in-out; transform: scaleX(-1); }

        /* Attack Animations */
        @keyframes attack-basic { 0% { transform: translateX(0); } 30% { transform: translateX(100px) scale(1.2); } 100% { transform: translateX(0); } }
        @keyframes attack-ultimate { 
            0% { transform: translateX(0) scale(1); filter: drop-shadow(0 0 20px gold); } 
            50% { transform: translateX(150px) scale(1.5); filter: drop-shadow(0 0 50px red); } 
            100% { transform: translateX(0) scale(1); filter: none; } 
        }
        @keyframes take-hit { 0% { transform: translateX(0) scaleX(-1); filter: brightness(1) sepia(0); } 20% { transform: translateX(20px) scaleX(-1); filter: brightness(2) sepia(1) hue-rotate(-50deg); } 100% { transform: translateX(0) scaleX(-1); filter: brightness(1) sepia(0); } }
        @keyframes stun { 0%, 100% { filter: grayscale(1); transform: rotate(0deg); } 25% { transform: rotate(-10deg); } 75% { transform: rotate(10deg); } }

        .anim-attack { animation: attack-basic 0.3s forwards; }
        .anim-ultimate { animation: attack-ultimate 0.6s forwards; }
        .anim-hit { animation: take-hit 0.4s forwards; }
        .anim-stun { animation: stun 0.5s infinite; filter: grayscale(1) brightness(0.5); pointer-events: none; }

        /* Health Bar Transitions */
        .hp-bar-inner { transition: width 0.3s ease-out, background-color 0.3s; }
        
        /* VFX */
        .vfx-slash {
            position: absolute; font-size: 100px; opacity: 0; pointer-events: none;
            text-shadow: 0 0 20px yellow; z-index: 50;
        }
        @keyframes slash-anim { 0% { opacity: 1; transform: scale(0.5) rotate(-20deg); } 100% { opacity: 0; transform: scale(2) rotate(20deg); } }
        .run-slash { animation: slash-anim 0.4s ease-out forwards; }
    </style>
</head>

            </div>
        </footer>

            { pinyin: "zěnmeyàng", vi: "như thế nào, ra sao", hanzi: "怎么样" },
            { pinyin: "zhè", vi: "đây, này", hanzi: "这" },
            { pinyin: "Zhōngguó", vi: "Trung Quốc", hanzi: "中国" },
            { pinyin: "zhōngwǔ", vi: "buổi trưa", hanzi: "中午" },
            { pinyin: "zhù", vi: "ở, cư trú", hanzi: "住" },
            { pinyin: "zhuōzi", vi: "cái bàn", hanzi: "桌子" },
            { pinyin: "zì", vi: "chữ, ký tự", hanzi: "字" },
            { pinyin: "zuótiān", vi: "hôm qua", hanzi: "昨天" },
            { pinyin: "zuò", vi: "làm, nấu", hanzi: "做" },
            { pinyin: "zuò", vi: "ngồi", hanzi: "坐" }
        ];

        // 2. State Variables
        let playerHP = 100;
        let enemyHP = 100;
        let combo = 0;
        let currentWord = null;
        let isStunned = false;
        let isGameOver = false;

        // DOM Elements
        const playerEl = document.getElementById('player');
        const enemyEl = document.getElementById('enemy');
        const playerHPBar = document.getElementById('player-hp-bar');
        const enemyHPBar = document.getElementById('enemy-hp-bar');
        const vfxEl = document.getElementById('vfx');
        const comboNodes = [document.getElementById('combo-1'), document.getElementById('combo-2'), document.getElementById('combo-3')];
        const comboText = document.getElementById('combo-text');
        const stunOverlay = document.getElementById('stun-overlay');
        const btns = document.querySelectorAll('.answer-btn');

        function playTTS(text) {
            // Using Web Speech API for TTS
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                utterance.rate = 1;
                window.speechSynthesis.cancel(); // Stop any ongoing speech
                window.speechSynthesis.speak(utterance);
            }
        }

        function updateHPUI() {
            playerHPBar.style.width = `${Math.max(0, playerHP)}%`;
            enemyHPBar.style.width = `${Math.max(0, enemyHP)}%`;
            document.getElementById('player-hp-text').innerText = `${Math.max(0, playerHP)}%`;
            document.getElementById('enemy-hp-text').innerText = `${Math.max(0, enemyHP)}%`;

            if(playerHP < 30) playerHPBar.style.backgroundColor = '#ef4444'; // Red
            else playerHPBar.style.backgroundColor = '#22c55e'; // Green
        }

        function updateComboUI() {
            comboNodes.forEach((node, index) => {
                if (index < combo) {
                    node.classList.remove('bg-gray-800');
                    node.classList.add('bg-yellow-400', 'shadow-[0_0_15px_yellow]');
                } else {
                    node.classList.add('bg-gray-800');
                    node.classList.remove('bg-yellow-400', 'shadow-[0_0_15px_yellow]');
                }
            });

            if (combo >= 3) {
                comboText.classList.remove('hidden');
                comboText.classList.add('animate-pulse');
            } else {
                comboText.classList.add('hidden');
                comboText.classList.remove('animate-pulse');
            }
        }

        function loadNextQuestion() {
            if (isGameOver) return;
            
            // Pick random word
            currentWord = vocabulary[Math.floor(Math.random() * vocabulary.length)];
            
            // Update UI
            document.getElementById('question-pinyin').innerText = currentWord.pinyin;
            document.getElementById('question-vi').innerText = currentWord.vi;

            // Prepare answers - Generate random distractors if not explicitly defined
            let distractors = currentWord.distractors;
            if (!distractors || distractors.length < 2) {
                distractors = [];
                let safetyCounter = 0;
                while (distractors.length < 2 && safetyCounter < 100) {
                    let randomVocab = vocabulary[Math.floor(Math.random() * vocabulary.length)];
                    // Đảm bảo không trùng với đáp án đúng và không trùng với distractor đã chọn
                    if (randomVocab.hanzi !== currentWord.hanzi && !distractors.includes(randomVocab.hanzi)) {
                        distractors.push(randomVocab.hanzi);
                    }
                    safetyCounter++;
                }
            }

            let answers = [currentWord.hanzi, ...distractors];
            // Shuffle answers
            answers.sort(() => Math.random() - 0.5);

            // Assign to buttons
            btns.forEach((btn, idx) => {
                btn.innerText = answers[idx];
                btn.onclick = () => handleAnswer(answers[idx], btn);
            });
        }

        function triggerVFX(isUltimate) {
            vfxEl.classList.remove('run-slash');
            void vfxEl.offsetWidth; // trigger reflow
            vfxEl.innerText = isUltimate ? '🐉🔥' : '💥';
            vfxEl.style.fontSize = isUltimate ? '150px' : '100px';
            vfxEl.classList.add('run-slash');
        }

        function checkWinCondition() {
            if (enemyHP <= 0 || playerHP <= 0) {
                isGameOver = true;
                const endScreen = document.getElementById('end-screen');
                const endTitle = document.getElementById('end-title');
                endScreen.classList.remove('hidden');
                endScreen.classList.add('flex');
                
                if (enemyHP <= 0) {
                    endTitle.innerText = "CHIẾN THẮNG! 🎉";
                    endTitle.className = "text-6xl font-black mb-4 text-green-400";
                } else {
                    endTitle.innerText = "THẤT BẠI 💀";
                    endTitle.className = "text-6xl font-black mb-4 text-red-500";
                }
            }
        }

        function handleAnswer(selectedHanzi, btnElement) {
            if (isStunned || isGameOver) return;

            if (selectedHanzi === currentWord.hanzi) {
                // Correct Answer
                playTTS(currentWord.hanzi);
                combo++;
                let isUltimate = combo >= 3;
                let damage = isUltimate ? 20 : 10;

                // Visuals for correct
                btnElement.classList.replace('bg-gray-700', 'bg-green-600');
                
                // Attack Animation
                playerEl.classList.remove('idle-p');
                playerEl.classList.add(isUltimate ? 'anim-ultimate' : 'anim-attack');
                
                setTimeout(() => {
                    triggerVFX(isUltimate);
                    enemyEl.classList.remove('idle-e');
                    enemyEl.classList.add('anim-hit');
                    enemyHP -= damage;
                    updateHPUI();
                    
                    setTimeout(() => {
                        enemyEl.classList.remove('anim-hit');
                        enemyEl.classList.add('idle-e');
                        checkWinCondition();
                    }, 400);

                    // Reset combo if ultimate used
                    if (isUltimate) combo = 0;
                    updateComboUI();

                }, isUltimate ? 300 : 150); // delay impact based on anim length

                // Restore idle and load next question
                setTimeout(() => {
                    playerEl.classList.remove('anim-attack', 'anim-ultimate');
                    playerEl.classList.add('idle-p');
                    btnElement.classList.replace('bg-green-600', 'bg-gray-700');
                    loadNextQuestion();
                }, 800);

            } else {
                // Wrong Answer (Stun Mechanism)
                isStunned = true;
                combo = 0;
                updateComboUI();
                
                // Visuals for wrong
                btnElement.classList.replace('bg-gray-700', 'bg-red-600');
                playerEl.classList.remove('idle-p');
                playerEl.classList.add('anim-stun');
                stunOverlay.classList.remove('hidden');

                setTimeout(() => {
                    isStunned = false;
                    playerEl.classList.remove('anim-stun');
                    playerEl.classList.add('idle-p');
                    stunOverlay.classList.add('hidden');
                    btnElement.classList.replace('bg-red-600', 'bg-gray-700');
                    loadNextQuestion(); // Refresh question to prevent guessing
                }, 2000);
            }
        }

        // Initialize Game
        function initGame() {
            playerHP = 100;
            enemyHP = 100;
            combo = 0;
            isStunned = false;
            isGameOver = false;
            
            updateHPUI();
            updateComboUI();
            document.getElementById('end-screen').classList.add('hidden');
            document.getElementById('end-screen').classList.remove('flex');
            
            loadNextQuestion();
        }

        // Start
        window.onload = initGame;

    </script>
</body>
</html>
