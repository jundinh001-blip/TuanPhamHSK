<!DOCTYPE html>
<html lang="en">
<head>

    <title>TuanPhamHSK - EdTech Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+SC:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a202c;
            overflow: hidden;
            touch-action: manipulation;
        }
        .hanzi-font { font-family: 'Noto Sans SC', sans-serif; }
        
        .stage-bg {
            background: linear-gradient(to bottom, #4a90e2, #87ceeb 60%, #e2e8f0 60%, #cbd5e1);
        }
        
        .character {
            font-size: 80px;
            transition: transform 0.1s ease-out, filter 0.2s;
            display: inline-block;
        }

        /* Idle Animations */
        @keyframes idle-player { 0%, 100% { transform: translateY(0) scaleX(1); } 50% { transform: translateY(-10px) scaleX(1.05); } }
        @keyframes idle-enemy { 0%, 100% { transform: translateY(0) scaleX(-1); } 50% { transform: translateY(-10px) scaleX(-1.05); } }
        
        .idle-p { animation: idle-player 2s infinite ease-in-out; }
        .idle-e { animation: idle-enemy 2.2s infinite ease-in-out; transform: scaleX(-1); }

        /* Attack Animations */
        @keyframes attack-basic { 0% { transform: translateX(0); } 30% { transform: translateX(100px) scale(1.2); } 100% { transform: translateX(0); } }
        @keyframes attack-ultimate { 
            0% { transform: translateX(0) scale(1); filter: drop-shadow(0 0 20px gold); } 
            50% { transform: translateX(150px) scale(1.5); filter: drop-shadow(0 0 50px red); } 
            100% { transform: translateX(0) scale(1); filter: none; } 
        }
        @keyframes take-hit { 0% { transform: translateX(0) scaleX(-1); filter: brightness(1) sepia(0); } 20% { transform: translateX(20px) scaleX(-1); filter: brightness(2) sepia(1) hue-rotate(-50deg); } 100% { transform: translateX(0) scaleX(-1); filter: brightness(1) sepia(0); } }
        @keyframes stun { 0%, 100% { filter: grayscale(1); transform: rotate(0deg); } 25% { transform: rotate(-10deg); } 75% { transform: rotate(10deg); } }

        .anim-attack { animation: attack-basic 0.3s forwards; }
        .anim-ultimate { animation: attack-ultimate 0.6s forwards; }
        .anim-hit { animation: take-hit 0.4s forwards; }
        .anim-stun { animation: stun 0.5s infinite; filter: grayscale(1) brightness(0.5); pointer-events: none; }

        /* Health Bar Transitions */
        .hp-bar-inner { transition: width 0.3s ease-out, background-color 0.3s; }
        
        /* VFX */
        .vfx-slash {
            position: absolute; font-size: 100px; opacity: 0; pointer-events: none;
            text-shadow: 0 0 20px yellow; z-index: 50;
        }
        @keyframes slash-anim { 0% { opacity: 1; transform: scale(0.5) rotate(-20deg); } 100% { opacity: 0; transform: scale(2) rotate(20deg); } }
        .run-slash { animation: slash-anim 0.4s ease-out forwards; }
    </style>
</head>

        function playTTS(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(utterance);
            }

        function generateRandomCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            return Array.from({length: 4}, () => chars[Math.floor(Math.random() * chars.length)]).join('');
        }

        function getRandomQuestionData() {
            const index = Math.floor(Math.random() * currentVocabulary.length);
            let distractors = [];
            let safetyCounter = 0;
            while (distractors.length < 2 && safetyCounter < 100) {
                let randomVocab = currentVocabulary[Math.floor(Math.random() * currentVocabulary.length)];
                if (randomVocab.hanzi !== currentVocabulary[index].hanzi && !distractors.includes(randomVocab.hanzi)) {
                    distractors.push(randomVocab.hanzi);
                }
                safetyCounter++;
            }
            return { index, distractors };
        }

        function updateComboUI() {
            DOM.comboNodes.forEach((node, index) => {

                } else {
                    node.classList.add('bg-gray-800');

                }
            });
            if (combo >= 3) DOM.comboText.classList.remove('hidden');
            else DOM.comboText.classList.add('hidden');
        }

        function renderQuestion() {
            if (isGameOver || currentWordIndex === -1) return;
            const word = currentVocabulary[currentWordIndex];
            
            document.getElementById('question-pinyin').innerText = word.pinyin;
            document.getElementById('question-vi').innerText = word.meaning;

            let answers = [word.hanzi, ...currentDistractors];
            // Sort to randomize placement predictably based on alphabetical order to keep it consistent between clients, 
            // or we could shuffle and store shuffle order. For simplicity, just sort.
            answers.sort(); 

            DOM.btns.forEach((btn, idx) => {
                btn.innerText = answers[idx];
                btn.classList.replace('bg-green-600', 'bg-gray-700');
                btn.classList.replace('bg-red-600', 'bg-gray-700');
            });
        }

            if (enemyHP <= 0 || playerHP <= 0) {
                isGameOver = true;
                DOM.endScreen.classList.remove('hidden');
                DOM.endScreen.classList.add('flex');
                
                const endTitle = document.getElementById('end-title');
                const endSub = document.getElementById('end-subtitle');
                
                if (playerHP > 0 && enemyHP <= 0) {

        async function joinPvPRoom(code) {
            if (!userId) return;
            if (code.length !== 4) return showToast("Mã phòng không hợp lệ!");
            
            const roomRef = getRoomRef(code);
            const snap = await getDoc(roomRef);
            
            if (!snap.exists()) {
                return showToast("Phòng không tồn tại!");
            }
            
            const data = snap.data();
            if (data.status !== 'waiting') {
                return showToast("Phòng đang diễn ra hoặc đã kết thúc!");
            }

            // Update room to playing
            await updateDoc(roomRef, {
                status: 'playing',
                guest: userId,
                [`players.${userId}`]: { hp: 100 }
            });

            currentRoomCode = code;
            listenToRoom(code);
        }

        function listenToRoom(code) {
            if (unsubscribeRoom) unsubscribeRoom();
            
            unsubscribeRoom = onSnapshot(getRoomRef(code), (snap) => {
                if (!snap.exists()) return;
                const data = snap.data();
                
                // ==========================================
                // BẢN VÁ LỖI: ĐỒNG BỘ HP Ở CẤP ĐỘ CAO NHẤT
                // Đảm bảo chạy trước mọi điều kiện data.status
                // ==========================================
                if (data.players) {
                    const enemyId = data.host === userId ? data.guest : data.host;
                    // Sử dụng toán tử ?? để tránh lỗi số 0 bị hiểu nhầm thành 100
                    playerHP = data.players[userId]?.hp ?? 100;
                    enemyHP = data.players[enemyId]?.hp ?? 100;
                    updateHPUI();
                }

                // 1. Handle Room Status (Khi mới vào phòng)
                if (data.status === 'playing' && DOM.pvpLobby.classList.contains('flex')) {
                    // Start Game!
                    DOM.pvpLobby.classList.remove('flex');
                    DOM.pvpLobby.classList.add('hidden');
                    DOM.mainMenu.classList.add('hidden');
                    
                    document.getElementById('enemy-name').innerText = "Đối thủ 🥷";
                    DOM.enemyEl.innerText = "🥷";
                    
                    // Nhận cấp độ HSK từ Host và load từ vựng tương ứng
                    if (data.level) {
                        currentVocabulary = hskData[data.level];
                    } else {
                        currentVocabulary = hskData['hsk1']; // Dự phòng nếu lỗi
                    }
                    
                    // (Đã xóa đoạn cập nhật HP cũ ở đây để tránh lặp code)
                    
                    currentWordIndex = data.question.index;
                    currentDistractors = data.question.distractors;
                    
                    renderQuestion();
                    showToast("Bắt đầu chiến đấu!");
                }
                
                // 2. Sync during 'playing' (Khi đang đánh nhau)
                if (data.status === 'playing') {
                    // (Đã xóa đoạn cập nhật HP cũ ở đây)

                    // Check for attacks
                    if (data.lastAttack && data.lastAttack.time > lastHandledAttackTime) {
                        lastHandledAttackTime = data.lastAttack.time;
                        const isMeAttacking = data.lastAttack.attacker === userId;
                        const isUltimate = data.lastAttack.isUltimate;
                        
                        if (isMeAttacking) {
                            DOM.playerEl.classList.remove('idle-p');
                            DOM.playerEl.classList.add(isUltimate ? 'anim-ultimate' : 'anim-attack');
                            setTimeout(() => { triggerVFX(isUltimate); DOM.enemyEl.classList.add('anim-hit'); }, 150);
                            setTimeout(() => { DOM.playerEl.classList.remove('anim-attack', 'anim-ultimate'); DOM.playerEl.classList.add('idle-p'); DOM.enemyEl.classList.remove('anim-hit'); }, 800);
                        } else {
                            DOM.enemyEl.classList.remove('idle-e');
                            DOM.enemyEl.classList.add('anim-attack'); 
                            
                            isStunned = true;
                            combo = 0; updateComboUI();
                            DOM.stunOverlay.classList.remove('hidden');
                            document.getElementById('stun-text').innerText = "Đối thủ quá nhanh!";

                            setTimeout(() => { 
                                triggerVFX(isUltimate); 
                                DOM.playerEl.classList.add('anim-hit'); 
                            }, 150);
                            
                            setTimeout(() => { 
                                DOM.enemyEl.classList.remove('anim-attack'); 
                                DOM.enemyEl.classList.add('idle-e'); 
                                DOM.playerEl.classList.remove('anim-hit');
                            }, 800);

                            setTimeout(() => {
                                isStunned = false;
                                DOM.stunOverlay.classList.add('hidden');
                                document.getElementById('stun-text').innerText = "Sai rồi! Choáng 2s";
                            }, 1500);
                        }
                    }

                    // Sync Question if changed
                    if (data.question.index !== currentWordIndex) {
                        currentWordIndex = data.question.index;
                        currentDistractors = data.question.distractors;
                        renderQuestion();
                    }

                    checkWinCondition();
                }

                // 3. Sync Finished state (Khi có người chết)
                if (data.status === 'finished') {
                    // Lúc này máu (HP) đã được cập nhật thành 0 ở block đầu tiên nên hàm checkWinCondition() sẽ bắt được sự kiện kết thúc.
                    checkWinCondition();
                }
            });
        }

        async function handleAnswerSelection(selectedText, btnElement) {
            if (isStunned || isGameOver) return;

            const correctWord = currentVocabulary[currentWordIndex];
            
            if (selectedText === correctWord.hanzi) {
                // Correct!
                playTTS(correctWord.hanzi);
                combo++;
                let isUltimate = combo >= 3;
                let damage = isUltimate ? 20 : 10;
                if (isUltimate) combo = 0;
                
                updateComboUI();
                btnElement.classList.replace('bg-gray-700', 'bg-green-600');

                if (gameMode === 'pve') {
                    // Local PvE logic
                    DOM.playerEl.classList.remove('idle-p');
                    DOM.playerEl.classList.add(isUltimate ? 'anim-ultimate' : 'anim-attack');
                    setTimeout(() => {
                        triggerVFX(isUltimate);
                        DOM.enemyEl.classList.add('anim-hit');
                        enemyHP -= damage;
                        updateHPUI();
                        checkWinCondition();
                    }, 150);
                    
                    setTimeout(() => {
                        DOM.playerEl.classList.remove('anim-attack', 'anim-ultimate');
                        DOM.playerEl.classList.add('idle-p');
                        DOM.enemyEl.classList.remove('anim-hit');
                        
                        // Load next PvE question
                        const nextQ = getRandomQuestionData();
                        currentWordIndex = nextQ.index;
                        currentDistractors = nextQ.distractors;
                        renderQuestion();
                    }, 800);
                } else if (gameMode === 'pvp') {
                    // PvP Logic: Update Server
                    const enemyId = Object.keys(playerHP === 100 ? {} : {}).length; // Hacky way, get enemyId properly
                    
                    if(!currentRoomCode) return;
                    
                    // We optimistically trigger local anim, server sync handles the rest
                    const roomRef = getRoomRef(currentRoomCode);
                    const nextQ = getRandomQuestionData();
                    
                    // We must read the latest HP or just decrement server-side, but standard updateDoc requires explicit value.
                    // To keep it simple without transactions, we trust local `enemyHP`.
                    const newEnemyHP = Math.max(0, enemyHP - damage);
                    
                    // Determine enemy id based on host/guest via getDoc might be slow, so we rely on snapshot state
                    // We know if we are updating, we update the OTHER player's hp field.
                    // Wait, Firestore update paths with dynamic keys need computed properties.
                    // Let's fetch snap quickly to get who is who.
                    const snap = await getDoc(roomRef);
                    const rData = snap.data();
                    const eId = rData.host === userId ? rData.guest : rData.host;
                    
                    let updates = {
                        [`players.${eId}.hp`]: newEnemyHP,
                        lastAttack: {
                            attacker: userId,
                            time: Date.now(),
                            isUltimate: isUltimate
                        },
                        question: {
                            index: nextQ.index,
                            distractors: nextQ.distractors
                        }
                    };

                    if (newEnemyHP <= 0) {
                        updates.status = 'finished';
                        updates.winner = userId;
                    }

                    await updateDoc(roomRef, updates);
                }
            } else {
                // Wrong! Local Stun
                isStunned = true;
                combo = 0; updateComboUI();
                btnElement.classList.replace('bg-gray-700', 'bg-red-600');
                DOM.playerEl.classList.remove('idle-p');
                DOM.playerEl.classList.add('anim-stun');
                DOM.stunOverlay.classList.remove('hidden');

                setTimeout(() => {
                    isStunned = false;
                    DOM.playerEl.classList.remove('anim-stun');
                    DOM.playerEl.classList.add('idle-p');
                    DOM.stunOverlay.classList.add('hidden');
                    btnElement.classList.replace('bg-red-600', 'bg-gray-700');
                    
                    if (gameMode === 'pve') {
                        const nextQ = getRandomQuestionData();
                        currentWordIndex = nextQ.index;
                        currentDistractors = nextQ.distractors;
                        renderQuestion();
                    }
                }, 2000);
            }
        }

        DOM.btns.forEach(btn => {
            btn.addEventListener('click', (e) => handleAnswerSelection(e.target.innerText, e.target));
        });

        document.getElementById('btn-pve').addEventListener('click', () => {
            gameMode = 'pve';
            
            // Lấy cấp độ HSK người dùng chọn và load từ vựng tương ứng
            const selectedLevel = document.getElementById('level-select').value;
            currentVocabulary = hskData[selectedLevel];
            
            DOM.mainMenu.classList.add('hidden');
            document.getElementById('enemy-name').innerText = "Boss HSK 🐉";
            DOM.enemyEl.innerText = "🐉";
            
            // Init Game locally
            playerHP = 100; enemyHP = 100; combo = 0; isGameOver = false; isStunned = false;
            updateHPUI(); updateComboUI();
            
            const initQ = getRandomQuestionData();
            currentWordIndex = initQ.index;
            currentDistractors = initQ.distractors;
            renderQuestion();
        });

        document.getElementById('btn-pvp').addEventListener('click', () => {
            if(!userId) return showToast("Vui lòng đợi kết nối máy chủ!");
            gameMode = 'pvp';
            DOM.pvpLobby.classList.remove('hidden');
            DOM.pvpLobby.classList.add('flex');
            DOM.lobbyActions.classList.remove('hidden');
            DOM.lobbyWaiting.classList.add('hidden');
        });

        document.getElementById('btn-create-room').addEventListener('click', createPvPRoom);
        document.getElementById('btn-join-room').addEventListener('click', () => {
            const code = document.getElementById('join-room-code').value.toUpperCase();
            joinPvPRoom(code);
        });

        document.getElementById('btn-lobby-back').addEventListener('click', () => {
            DOM.pvpLobby.classList.add('hidden');
            DOM.pvpLobby.classList.remove('flex');
        });

        document.getElementById('btn-cancel-room').addEventListener('click', async () => {
            if(unsubscribeRoom) unsubscribeRoom();
            if(currentRoomCode) {
                // optional: mark room as cancelled
                await updateDoc(getRoomRef(currentRoomCode), { status: 'finished' }).catch(()=>{});
            }
            DOM.lobbyActions.classList.remove('hidden');
            DOM.lobbyWaiting.classList.add('hidden');
            DOM.lobbyWaiting.classList.remove('flex');
        });

        document.getElementById('btn-copy-link').addEventListener('click', () => {
            const shareInput = document.getElementById('share-link-input');
            
            // Nếu đang trong môi trường preview, thông báo cho người dùng biết
            if (shareInput.value.includes("Môi trường giả lập")) {
                showToast("Bạn đang ở bản Preview. Hãy nhập mã thủ công!");
                return;
            }

            shareInput.select();
            shareInput.setSelectionRange(0, 99999); // Dành cho thiết bị di động
            try {
                // Sử dụng execCommand('copy') để đảm bảo tương thích tốt nhất trong môi trường iFrame
                document.execCommand('copy');
                showToast("Đã copy link mời!");
                
                // Hiệu ứng đổi màu nút để báo hiệu thành công
                const btn = document.getElementById('btn-copy-link');
                const originalText = btn.innerText;
                btn.innerText = "Đã Copy!";
                btn.classList.replace('bg-blue-600', 'bg-green-600');
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.classList.replace('bg-green-600', 'bg-blue-600');
                }, 2000);
            } catch (err) {
                showToast("Lỗi: Trình duyệt chặn copy, hãy copy thủ công!");
            }
        });

        document.getElementById('btn-return-menu').addEventListener('click', () => {
            if(unsubscribeRoom) unsubscribeRoom();
            DOM.endScreen.classList.add('hidden');
            DOM.endScreen.classList.remove('flex');
            DOM.mainMenu.classList.remove('hidden');
        });

        // Initialize App
        window.addEventListener('load', initAuth);

    </script>
</body>
</html>
